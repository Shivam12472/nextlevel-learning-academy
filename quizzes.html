<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0284c7"><title>Quizzes | Next Level Learning Academy</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:Inter,system-ui,sans-serif}.panel{background:white;border:1px solid #e2e8f0;border-radius:18px;padding:18px;box-shadow:0 5px 18px #0f172a0b}button:disabled{opacity:.45;cursor:not-allowed}</style>
</head><body class="bg-slate-50 text-slate-900 min-h-screen">
<header class="bg-white border-b border-slate-200 sticky top-0 z-20"><div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap gap-3 items-center justify-between"><a href="/" class="font-black text-sky-700 text-lg">Next Level Learning Academy</a><nav class="flex gap-2 text-sm font-bold"><a class="px-3 py-2 rounded-lg hover:bg-sky-50" href="/study-material.html">Study Material</a><a class="px-3 py-2 rounded-lg hover:bg-sky-50" href="/quizzes.html">Quizzes</a><a class="px-3 py-2 rounded-lg bg-sky-600 text-white" href="/account.html">Student Login</a></nav></div></header>
<main class="max-w-5xl mx-auto px-4 py-7"><div class="mb-6"><p class="text-xs uppercase tracking-widest font-black text-sky-700">Learn without barriers</p><h1 class="text-3xl font-black mt-1">Practice Quizzes</h1><p class="text-slate-600 mt-2">Published learning resources from the academy. No student login is needed.</p></div>
<div id="status" class="panel text-sm text-slate-600">Loading published content…</div><section id="items" class="grid sm:grid-cols-2 gap-4 mt-4"></section></main>
<footer class="text-center text-xs text-slate-500 py-8">© Next Level Learning Academy · Public learning area</footer>
<script>
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sb=window.NLLA_CREATE_SUPABASE_CLIENT?.();
function status(msg,bad=false){$('status').textContent=msg;$('status').className='panel text-sm '+(bad?'text-rose-700 bg-rose-50':'text-slate-600')}
</script>
<script>
let active=null,answers=[],questionIndex=0;async function load(){if(!sb){status('Supabase connection is not configured. Please contact the academy administrator.',true);return}const {data,error}=await sb.from('academy_content').select('id,title,description,category,quiz_json,is_published,sort_order,created_at').eq('is_published',true).eq('content_type','quiz').order('sort_order',{ascending:true}).order('created_at',{ascending:false});if(error){status('Published quizzes could not be loaded: '+error.message,true);return}const rows=(data||[]).filter(x=>Array.isArray(x.quiz_json)&&x.quiz_json.length);status(rows.length?rows.length+' published quiz/quiz sets available.':'No quizzes have been published yet.');$('items').innerHTML=rows.map(x=>`<article class="panel"><div class="text-xs font-black uppercase tracking-wider text-indigo-700">${esc(x.category||'Practice Quiz')}</div><h2 class="text-lg font-extrabold mt-2">${esc(x.title)}</h2><p class="text-sm text-slate-600 mt-2">${esc(x.description||'Practice questions with instant results and explanations.')}</p><p class="text-xs text-slate-500 mt-3">${x.quiz_json.length} questions</p><button data-quiz="${esc(x.id)}" class="mt-4 rounded-lg bg-indigo-600 text-white font-bold text-sm px-4 py-2">Start Quiz →</button><div id="quizbox-${esc(x.id)}" class="mt-4"></div></article>`).join('');$('items').querySelectorAll('[data-quiz]').forEach(b=>b.addEventListener('click',()=>startQuiz(rows.find(x=>x.id===b.dataset.quiz))))}
function startQuiz(x){active=x;answers=Array(x.quiz_json.length).fill(null);questionIndex=0;renderQuestion()}
function renderQuestion(){const box=$('quizbox-'+active.id),q=active.quiz_json[questionIndex],opts=Array.isArray(q.options)?q.options:[];if(!q||!opts.length){box.innerHTML='<p class="text-rose-700 text-sm">This quiz question has invalid or missing options.</p>';return}box.innerHTML=`<div class="rounded-xl bg-slate-50 border p-3"><div class="flex justify-between text-xs font-bold text-slate-500"><span>QUESTION ${questionIndex+1} / ${active.quiz_json.length}</span><span>${answers.filter(v=>v!==null).length} answered</span></div><h3 class="font-bold mt-3">${esc(q.question)}</h3><div class="grid gap-2 mt-3">${opts.map((o,i)=>`<button data-option="${i}" class="text-left rounded-lg border p-3 text-sm font-semibold ${answers[questionIndex]===i?'bg-indigo-50 border-indigo-500':'bg-white'}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div><div class="flex justify-between gap-2 mt-4"><button id="prevQ" class="border rounded-lg px-3 py-2 text-sm font-bold" ${questionIndex===0?'disabled':''}>Previous</button>${questionIndex<active.quiz_json.length-1?'<button id="nextQ" class="bg-indigo-600 text-white rounded-lg px-4 py-2 text-sm font-bold">Next</button>':'<button id="finishQ" class="bg-emerald-600 text-white rounded-lg px-4 py-2 text-sm font-bold">Submit Quiz</button>'}</div></div>`;box.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{answers[questionIndex]=Number(b.dataset.option);renderQuestion()});box.querySelector('#prevQ').onclick=()=>{questionIndex--;renderQuestion()};box.querySelector('#nextQ')?.addEventListener('click',()=>{questionIndex++;renderQuestion()});box.querySelector('#finishQ')?.addEventListener('click',showResult)}
function showResult(){const box=$('quizbox-'+active.id);let score=0;const details=active.quiz_json.map((q,i)=>{const ok=Number(answers[i])===Number(q.answer);if(ok)score++;return `<div class="border-t py-3"><p class="font-bold text-sm">${i+1}. ${esc(q.question)}</p><p class="text-sm mt-1 ${ok?'text-emerald-700':'text-rose-700'}">Your answer: ${answers[i]===null?'Not answered':esc(q.options?.[answers[i]])} · ${ok?'Correct':'Incorrect'}</p><p class="text-sm text-slate-700 mt-1">Correct answer: <b>${esc(q.options?.[Number(q.answer)]??'Not specified')}</b></p>${q.explanation?`<p class="text-sm text-slate-600 mt-1">Explanation: ${esc(q.explanation)}</p>`:''}</div>`}).join('');box.innerHTML=`<div class="rounded-xl bg-indigo-50 border border-indigo-100 p-4"><p class="text-xs uppercase font-black text-indigo-700">Quiz completed</p><p class="text-3xl font-black mt-1">${score} / ${active.quiz_json.length}</p><p class="text-sm text-slate-600">Score: ${Math.round(score/active.quiz_json.length*100)}%</p><button id="retry" class="mt-3 bg-indigo-600 text-white rounded-lg px-4 py-2 text-sm font-bold">Try Again</button></div><div class="mt-3">${details}</div>`;box.querySelector('#retry').onclick=()=>startQuiz(active)}load();
</script>
</body></html>
