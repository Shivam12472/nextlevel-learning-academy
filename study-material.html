<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0284c7"><title>Study Material | Next Level Learning Academy</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:Inter,system-ui,sans-serif}.panel{background:white;border:1px solid #e2e8f0;border-radius:18px;padding:18px;box-shadow:0 5px 18px #0f172a0b}button:disabled{opacity:.45;cursor:not-allowed}</style>
</head><body class="bg-slate-50 text-slate-900 min-h-screen">
<header class="bg-white border-b border-slate-200 sticky top-0 z-20"><div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap gap-3 items-center justify-between"><a href="/" class="font-black text-sky-700 text-lg">Next Level Learning Academy</a><nav class="flex gap-2 text-sm font-bold"><a class="px-3 py-2 rounded-lg hover:bg-sky-50" href="/study-material.html">Study Material</a><a class="px-3 py-2 rounded-lg hover:bg-sky-50" href="/quizzes.html">Quizzes</a><a class="px-3 py-2 rounded-lg bg-sky-600 text-white" href="/account.html">Student Login</a></nav></div></header>
<main class="max-w-5xl mx-auto px-4 py-7"><div class="mb-6"><p class="text-xs uppercase tracking-widest font-black text-sky-700">Learn without barriers</p><h1 class="text-3xl font-black mt-1">Study Material</h1><p class="text-slate-600 mt-2">Published learning resources from the academy. No student login is needed.</p></div>
<div id="status" class="panel text-sm text-slate-600">Loading published content…</div><section id="items" class="grid sm:grid-cols-2 gap-4 mt-4"></section></main>
<footer class="text-center text-xs text-slate-500 py-8">© Next Level Learning Academy · Public learning area</footer>
<script>
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sb=window.NLLA_CREATE_SUPABASE_CLIENT?.();const safeUrl=v=>{try{const u=new URL(v,location.href);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}};
function status(msg,bad=false){$('status').textContent=msg;$('status').className='panel text-sm '+(bad?'text-rose-700 bg-rose-50':'text-slate-600')}
</script>
<script>
async function load(){if(!sb){status('Supabase connection is not configured. Please contact the academy administrator.',true);return}const {data,error}=await sb.from('academy_content').select('id,title,description,category,content_type,content_url,file_path,is_published,sort_order,created_at').eq('is_published',true).in('content_type',['material','video']).order('sort_order',{ascending:true}).order('created_at',{ascending:false});if(error){status('Published materials could not be loaded: '+error.message,true);return}const rows=data||[];status(rows.length?rows.length+' published resource(s) available.':'No study material has been published yet.');$('items').innerHTML=rows.map(x=>`<article class="panel"><div class="text-xs font-black uppercase tracking-wider text-sky-700">${esc(x.category||x.content_type||'Study Resource')}</div><h2 class="text-lg font-extrabold mt-2">${esc(x.title)}</h2><p class="text-sm text-slate-600 mt-2 whitespace-pre-line">${esc(x.description||'')}</p><div class="mt-4">${safeUrl(x.content_url)?`<a class="inline-block rounded-lg bg-sky-600 text-white font-bold text-sm px-4 py-2" href="${esc(safeUrl(x.content_url))}" target="_blank" rel="noopener noreferrer">${x.content_type==='video'?'Watch / Open':'Open resource'} ↗</a>`:x.file_path?`<button data-file="${esc(x.id)}" class="rounded-lg bg-sky-600 text-white font-bold text-sm px-4 py-2">Open / Download ↗</button>`:'<span class="text-xs text-amber-700">Resource file/link not attached yet.</span>'}</div></article>`).join('');$('items').querySelectorAll('[data-file]').forEach(b=>b.addEventListener('click',()=>openFile(rows.find(x=>x.id===b.dataset.file))))}
async function openFile(x){if(!x||!sb)return;const {data,error}=await sb.storage.from('academy-materials').createSignedUrl(x.file_path,180);if(error){status('This file is not publicly accessible yet. The administrator must enable read access for published academy files. ('+error.message+')',true);return}window.open(data.signedUrl,'_blank','noopener,noreferrer')}load();
</script>
</body></html>
